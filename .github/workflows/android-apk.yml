name: Android APK CI

on:
  push:
    branches: [main, feature/supabase-real-backend]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Configure project
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Configure GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          printf '%s\\n' "SUPABASE_URL=https://fcnqwxsgjmqdkxbseeyu.supabase.co" "SUPABASE_ANON_KEY=$SUPABASE_PUBLISHABLE_KEY" > .env
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: act-service-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
